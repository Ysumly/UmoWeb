map $request_uri $security_log_path {
    ~^([^?]*) $1;
    default $uri;
}

log_format umoweb_security escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$security_log_path","status":$status,"bytes":$body_bytes_sent}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;

    include /etc/nginx/umoweb/trusted-proxies.conf;
    access_log /var/log/umoweb/access.log umoweb_security;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api|images)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /privacy-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
