name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed text for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Test sensitive information scanner
        run: bash scripts/ci/tests/scan-sensitive-info-test.sh

      - name: Test fake OpenAI provider
        run: bash scripts/ai/tests/fake-openai-server.sh

      - name: Scan tracked files for sensitive information
        run: bash scripts/ci/scan-sensitive-info.sh

      - name: Test release scripts
        shell: bash
        run: bash scripts/release/tests/release-unit.sh

      - name: Test access aggregation and retention
        shell: bash
        run: bash scripts/access/tests/access-unit.sh

      - name: Test Nginx six-field access logs
        shell: bash
        run: bash scripts/access/tests/nginx-access-log-test.sh

      - name: Test PowerShell release helpers
        shell: pwsh
        run: ./scripts/release/tests/release-unit.ps1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Server Side/UmoWebBackend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Server Side/UmoWebBackend/pom.xml

      - name: Run backend tests
        run: mvn -B test

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Server Side/UmoWebBackend/pom.xml

      - name: Run MySQL integration
        shell: bash
        run: bash scripts/ci/mysql-integration.sh

      - name: Upload MySQL integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/umoweb-backend.log
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Client Side/umo-web-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: Client Side/umo-web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Client Side/umo-web-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: Client Side/umo-web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            Client Side/umo-web-frontend/playwright-report/
            Client Side/umo-web-frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
