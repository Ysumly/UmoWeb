server:
  port: 8080

spring:
  application:
    name: UmoWebBackend
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/umo_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ysumly.umowebbackend.model.entity,com.ysumly.umowebbackend.model.dto
  configuration:
    map-underscore-to-camel-case: true

app:
  storage-path: ./data
  ai:
    enabled: ${APP_AI_ENABLED:false}
    max-input-chars: 20000
    max-output-chars: 60000
    timeout-seconds: 180
    max-concurrent-requests: 1
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:}
  search:
    backfill-only: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    allow-default-credentials: false
    trusted-proxies: ${TRUSTED_PROXIES:}
    login-max-failures: 5
    login-window-seconds: 900
    search-rate-limit-seconds: 10
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
    zone: ${APP_SCHEDULING_ZONE:Asia/Shanghai}
    poll-interval-ms: ${APP_SCHEDULING_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${APP_SCHEDULING_INITIAL_DELAY_MS:30000}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-default-only}
    expiration-hours: 24
  init:
    admin-username: ${INIT_ADMIN_USER:admin}
    admin-password: ${INIT_ADMIN_PASS:admin123}
