name: umoweb

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-umo_blog}
      MYSQL_USER: ${MYSQL_USER:-umo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/design/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/design/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - umoweb

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-umo_blog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${MYSQL_USER:-umo}
      DB_PASS: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INIT_ADMIN_USER: ${INIT_ADMIN_USER:-admin}
      INIT_ADMIN_PASS: ${INIT_ADMIN_PASS:?INIT_ADMIN_PASS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.10/32}
      APP_STORAGE_PATH: /app/data
      TZ: Asia/Shanghai
    volumes:
      - app_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - umoweb

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/secret-admin}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      umoweb:
        ipv4_address: ${FRONTEND_IP:-172.30.0.10}

volumes:
  mysql_data:
  app_data:

networks:
  umoweb:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
